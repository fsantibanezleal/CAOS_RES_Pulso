# Pulso declares NO package of its own (hard rule 0, conventions/no-internal-packages.md). The engine is
# `fracpta` (PyPI), pinned in data-pipeline/requirements.txt; the build tooling under data-pipeline/pipeline/
# is invoked by path (data-pipeline/run.py). Only tool configuration lives here.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# S/I/R are the standard SIR compartment names; single-letter here is intentional domain notation, not ambiguous.
ignore = ["E741"]
